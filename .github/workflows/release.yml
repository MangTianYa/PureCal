name: PureCal CI & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Configure Android SDK Platforms and Build Tools
        run: |
          yes | sdkmanager --licenses || true
          
          # Attempt to install platform 37 and build-tools 37
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" || sdkmanager "platforms;android-37.0" || sdkmanager "platforms;android-37" || true
          
          # Prepare platforms/android-37
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            cp -r "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
            sed -i 's/platforms;android-37.0/platforms;android-37/g' "$ANDROID_HOME/platforms/android-37/package.xml" 2>/dev/null || true
            sed -i 's/<api-level>37.0<\/api-level>/<api-level>37<\/api-level>/g' "$ANDROID_HOME/platforms/android-37/package.xml" 2>/dev/null || true
          elif [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            echo "Fallback: creating platforms/android-37 from android-35"
            cp -r "$ANDROID_HOME/platforms/android-35" "$ANDROID_HOME/platforms/android-37"
            sed -i 's/platforms;android-35/platforms;android-37/g' "$ANDROID_HOME/platforms/android-37/package.xml" 2>/dev/null || true
            sed -i 's/<api-level>35<\/api-level>/<api-level>37<\/api-level>/g' "$ANDROID_HOME/platforms/android-37/package.xml" 2>/dev/null || true
            sed -i 's/AndroidVersion.ApiLevel=35/AndroidVersion.ApiLevel=37/g' "$ANDROID_HOME/platforms/android-37/source.properties" 2>/dev/null || true
          fi
          
          # Prepare build-tools/37.0.0
          if [ ! -d "$ANDROID_HOME/build-tools/37.0.0" ]; then
            echo "Fallback: creating build-tools/37.0.0 from available build-tools"
            LATEST_BT=$(ls -d $ANDROID_HOME/build-tools/3* | tail -n 1)
            cp -r "$LATEST_BT" "$ANDROID_HOME/build-tools/37.0.0"
            sed -i 's/Pkg.Revision=.*/Pkg.Revision=37.0.0/g' "$ANDROID_HOME/build-tools/37.0.0/source.properties" 2>/dev/null || true
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Prepare Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SIGNING_STORE_PASSWORD" ] && [ -n "$SIGNING_KEY_ALIAS" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            echo "Using release signing keystore from GitHub Secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            echo "SIGNING_KEYSTORE_PATH=keystore/release.jks" >> $GITHUB_ENV
            echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> $GITHUB_ENV
            echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> $GITHUB_ENV
            echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "GitHub Secrets not configured; generating ephemeral CI signing keystore"
            EPHEMERAL_PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v \
              -keystore keystore/ci-ephemeral.jks \
              -alias purecal \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$EPHEMERAL_PASS" -keypass "$EPHEMERAL_PASS" \
              -dname "CN=PureCal CI, OU=Mobile, O=PureCal, L=Unknown, ST=Unknown, C=CN"
            echo "SIGNING_KEYSTORE_PATH=keystore/ci-ephemeral.jks" >> $GITHUB_ENV
            echo "SIGNING_STORE_PASSWORD=$EPHEMERAL_PASS" >> $GITHUB_ENV
            echo "SIGNING_KEY_ALIAS=purecal" >> $GITHUB_ENV
            echo "SIGNING_KEY_PASSWORD=$EPHEMERAL_PASS" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        id: prep
        run: |
          MAJOR=$(grep 'VERSION_MAJOR' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
          MINOR=$(grep 'VERSION_MINOR' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
          PATCH=$(grep 'VERSION_PATCH' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
          CODE=$(grep 'VERSION_CODE' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v${VERSION_NAME}"
          fi
          
          APK_NAME="PureCal-${TAG_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          SHA256_VAL=$(cut -d' ' -f1 "${APK_NAME}.sha256")
          
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${CODE}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "sha256=${SHA256_VAL}" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.apk_name }}
          path: |
            ${{ steps.prep.outputs.apk_name }}
            ${{ steps.prep.outputs.apk_name }}.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: "PureCal 日历 ${{ steps.prep.outputs.tag_name }}"
          body: |
            ### 📱 PureCal 日历 ${{ steps.prep.outputs.tag_name }} (Build ${{ steps.prep.outputs.version_code }})
            
            - 🎨 **视觉风格**：基于 Google Pixel / Material Design 3 (Material You) 设计语言
            - ⚡ **性能优化**：月份切换 GPU 纯硬件加速过渡，彻底消除掉帧与重组卡顿
            - 🛠️ **架构配置**：专属 ARM 64-bit (`arm64-v8a`) 高性能原生构建
            - 📦 **目标环境**：适配 Android 17 (API 37) 最新 SDK，全面向后兼容 Android 8.0+
            - 🟢 **图标规范**：完美适配 Pixel Launcher 圆形自适应图标
            
            #### 校验信息
            ```text
            SHA-256: ${{ steps.prep.outputs.sha256 }}
            ```
          files: |
            ${{ steps.prep.outputs.apk_name }}
            ${{ steps.prep.outputs.apk_name }}.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
